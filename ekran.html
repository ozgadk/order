<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Snuggest — Ekrāns</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --forest:#0F3324; --deep:#0A241A; --gold:#D9AE55; --gold-soft:#B8924A;
  --orange:#EC7A2C; --cream:#F4ECD9; --dim:#BDB5A0;
  --serif:'Gloock', Georgia, 'Times New Roman', serif;
  --sans:'Instrument Sans','Helvetica Neue',Arial,sans-serif;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden;cursor:none}
body{display:flex;align-items:center;justify-content:center;font-family:var(--sans);color:var(--cream)}

#stage{width:1080px;height:1920px;flex:none;position:relative;overflow:hidden;transform-origin:center;
  background:radial-gradient(ellipse 1000px 700px at 50% -8%,rgba(217,174,85,.13),transparent 70%),var(--forest)}

/* ---------- slides ---------- */
.slide{position:absolute;left:0;right:0;top:0;height:1790px;padding:56px 70px 0;
  opacity:0;transform:translateY(30px);transition:opacity .9s ease,transform .9s ease;pointer-events:none}
.slide.show{opacity:1;transform:none}

.top{display:flex;align-items:center;gap:22px;padding-bottom:26px;border-bottom:2px solid var(--gold-soft);margin-bottom:38px}
.top .logo{width:92px;height:92px;flex:none}
.top .b{flex:1}
.top .b .s{font-size:20px;letter-spacing:4px;color:var(--gold)}
.top .b .n{font-family:var(--serif);font-size:54px;line-height:1}
.top .ttl{text-align:right}
.top .ttl .lv{font-family:var(--serif);font-size:46px;color:var(--gold);line-height:1.05}
.top .ttl .en{font-size:22px;color:var(--dim);margin-top:4px}

h3{font-family:var(--serif);font-weight:400;font-size:40px;color:var(--gold);margin:6px 0 20px;
  display:flex;justify-content:space-between;align-items:baseline;gap:20px}
h3 small{font-family:var(--sans);font-size:21px;color:var(--dim);font-weight:500}
.sec+.sec{margin-top:34px}

.it{display:flex;gap:18px;align-items:baseline;margin-bottom:20px}
.it .t{flex:1;min-width:0}
.it .nm{font-size:30px;font-weight:600;line-height:1.15}
.it .nm .en{font-weight:400;color:var(--dim);font-size:24px}
.it .tag{display:inline-block;font-size:17px;font-weight:600;color:var(--forest);background:var(--gold);
  border-radius:20px;padding:2px 11px;margin-left:10px;vertical-align:4px}
.it .tag.hot{background:var(--orange);color:var(--deep)}
.it .ds{font-size:21px;color:var(--dim);margin-top:4px;line-height:1.3;font-style:italic}
.it .pr{font-family:var(--serif);font-size:36px;white-space:nowrap;text-align:right}
.it .pr .old{display:none;font-size:26px;color:var(--dim);text-decoration:line-through;text-decoration-color:var(--orange);text-decoration-thickness:3px;margin-right:12px}
body.hh .it.hhi .pr .old{display:inline}
body.hh .it.hhi .pr .now{color:var(--orange)}

.grid2{display:grid;grid-template-columns:1fr 1fr;column-gap:56px}
.cmp .it{margin-bottom:13px}
.cmp .it .nm{font-size:26px}
.cmp .it .pr{font-size:28px}
.note{font-size:24px;color:var(--dim);font-style:italic;margin:-6px 0 8px}
.sauce{font-size:23px;color:var(--dim);line-height:1.5}

/* hh ribbon on cocktail slides */
.rib{display:none;margin:-14px 0 26px;padding:14px 24px;background:var(--orange);color:var(--deep);
  font-weight:700;font-size:26px;border-radius:12px;justify-content:space-between}
body.hh .rib{display:flex}
body.fpon footer{background:#1A0836}

/* ---------- HH menu ---------- */
.hhbar{display:flex;justify-content:space-between;align-items:center;background:var(--orange);color:var(--deep);
  border-radius:18px;padding:18px 28px;margin:-10px 0 30px}
.hhbar b{display:block;font-size:34px}.hhbar span{font-size:22px;font-weight:600}
.hhp5{font-family:var(--serif);font-size:84px;line-height:.9;display:flex;align-items:center;gap:12px}
.hhp5 small{font-family:var(--sans);font-size:18px;font-weight:700;line-height:1.2;text-align:left}
.hhg .it{margin-bottom:16px}
.hhp{color:var(--orange)}

/* ---------- ambient animations ---------- */
#fx{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#slides{position:relative;z-index:1}
.bub{position:absolute;bottom:-30px;border-radius:50%;border:2px solid rgba(217,174,85,.35);animation:rise linear infinite}
.tw{position:absolute;color:var(--gold);animation:spark 3s ease-in-out infinite}
.top{background:linear-gradient(90deg,transparent,rgba(217,174,85,.08),transparent) no-repeat;background-size:40% 100%;animation:sweep 6s ease-in-out infinite}
.top .ttl .lv{display:inline-block;animation:float 4s ease-in-out infinite}
@keyframes rise{0%{transform:translateY(0) translateX(0);opacity:0}10%{opacity:1}90%{opacity:.8}100%{transform:translateY(-1950px) translateX(30px);opacity:0}}
@keyframes sweep{0%{background-position:-60% 0}60%,100%{background-position:170% 0}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* ---------- hero ---------- */
.hero{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;height:1730px}
.hero .kick{font-size:28px;letter-spacing:5px;color:var(--gold)}
.hero h1{font-family:var(--serif);font-weight:400;font-size:140px;line-height:.95;margin-top:18px}
.hero h2{font-family:var(--serif);font-weight:400;font-size:64px;color:var(--gold);margin-top:10px}
.heroRow{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:30px;width:100%}
.bigpanda{width:600px;height:646px;flex:none}
.badge{width:330px;height:330px;position:relative;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center}
.badge .ring{position:absolute;inset:0;border:4px dashed var(--gold);border-radius:50%;animation:spin 30s linear infinite}
.badge .disc{position:absolute;inset:22px;background:var(--orange);border-radius:50%;animation:beat 2.4s ease-in-out infinite}
.badge .v{position:relative;font-family:var(--serif);font-size:170px;line-height:.9;color:var(--deep)}
.badge .v small{font-size:80px}
.badge .l{position:relative;font-size:23px;font-weight:700;color:var(--deep);margin-top:6px}
.when{margin-top:34px;font-size:40px;font-weight:600}
.when span{display:block;font-size:28px;color:var(--dim);font-weight:400;margin-top:6px}
.status{margin-top:34px;display:inline-flex;align-items:center;gap:14px;font-size:34px;font-weight:700;
  padding:16px 34px;border-radius:60px;border:3px solid var(--gold);color:var(--gold)}
body.hh .status{background:var(--orange);border-color:var(--orange);color:var(--deep)}
.status .dot{width:18px;height:18px;border-radius:50%;background:currentColor}
body.hh .status .dot{animation:pulse 1.4s ease-in-out infinite}
.fine{margin-top:26px;font-size:24px;color:var(--dim)}

/* ---------- footer ---------- */
footer{transition:background .9s;position:absolute;left:0;right:0;bottom:0;height:130px;background:var(--deep);
  display:flex;align-items:center;justify-content:space-between;padding:0 60px}
#clock{font-family:var(--serif);font-size:58px;line-height:1}
.dots{display:flex;gap:10px}
.dots i{width:13px;height:13px;border-radius:50%;background:rgba(217,174,85,.3)}
.dots i.on{background:var(--gold)}
.addr{font-size:22px;color:var(--dim);line-height:1.35}
.addr b{color:var(--cream);font-weight:600}

/* ---------- Falcı Panda slide ---------- */
.fp{position:absolute;inset:0;background:radial-gradient(ellipse 900px 700px at 50% 38%,#5B2A9A 0%,#3A1670 45%,#200B40 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;text-align:center;padding:30px 70px 20px;color:#F4ECD9;overflow:hidden}
.fp>*{margin-top:0!important}
.fp .rb{position:absolute;left:0;right:0;top:0;height:10px;background:linear-gradient(90deg,#8BD450,#3FC9B0,#4FB7F5,#A78BFA,#F0567A,#F6B04A)}
.fp .k{font-size:26px;letter-spacing:9px;color:#F6C453;font-weight:600}
.fp h1{font-family:var(--serif);font-weight:400;font-size:112px;line-height:1;margin-top:16px;
  background:linear-gradient(90deg,#FFD27A,#F7A1B5,#E2A6F2);-webkit-background-clip:text;background-clip:text;color:transparent}
.fp h2{font-family:var(--serif);font-weight:400;font-size:50px;color:#E7D6FF;margin-top:6px}
.fp .sub{font-size:30px;color:#E7D6FF;margin-top:16px}
.fp .scene{position:relative;width:940px;height:600px;margin-top:20px}
.fp .card{position:absolute;top:70px;width:230px;height:360px;border-radius:20px;background:#2E1260;border:3px solid #F6C453;
  box-shadow:0 0 40px rgba(167,139,250,.45);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:22px 14px}
.fp .card .rn{font-family:var(--serif);font-size:34px;color:#F6C453}
.fp .card .ic{font-size:110px;line-height:1;color:#FFE9A8}
.fp .card .nm{font-family:var(--serif);font-size:24px;background:#1A0836;border:1px solid #F6C453;border-radius:8px;padding:4px 14px;color:#F4ECD9}
.fp .c1{left:20px;transform:rotate(-14deg);animation:cardL 5s ease-in-out infinite}
.fp .c2{right:20px;transform:rotate(14deg);animation:cardR 5s ease-in-out infinite}
.fp .fpanda{position:absolute;left:50%;top:0;width:440px;height:600px;margin-left:-220px}
.fp .orb{transform-box:fill-box;transform-origin:center;animation:orb 3s ease-in-out infinite}
.fp .swirl{transform-box:fill-box;transform-origin:center;animation:spin 9s linear infinite}
.fp .pill{margin-top:14px;background:linear-gradient(90deg,#FFD27A,#F7A1B5);color:#2A0E52;font-weight:700;font-size:38px;
  border-radius:60px;padding:18px 44px;animation:beat 2.4s ease-in-out infinite}
.fp .pill span{display:block;font-size:24px;font-weight:600;margin-top:2px}
.fp .steps{width:100%;margin-top:34px;display:grid;grid-template-columns:repeat(3,1fr);gap:22px;text-align:left}
.fp .st{background:rgba(255,255,255,.06);border:1px solid rgba(246,196,83,.35);border-radius:22px;padding:22px 20px}
.fp .st .n{width:58px;height:58px;border-radius:50%;border:3px solid #F6C453;color:#F6C453;font-family:var(--serif);font-size:32px;
  display:flex;align-items:center;justify-content:center}
.fp .st b{display:block;font-family:var(--serif);font-weight:400;font-size:30px;color:#FFE3A0;margin-top:14px;line-height:1.1}
.fp .st i{display:block;font-style:normal;font-size:21px;color:#D9C8F5;margin-top:8px;line-height:1.3}
.fp .fine2{margin-top:26px;font-size:22px;color:#BFA9E6;font-style:italic}
.fp .langs{display:inline-block;margin-top:14px;border:2px solid #F6C453;border-radius:40px;padding:6px 26px;color:#F6C453;font-size:24px;font-weight:600}
.fp .st2{position:absolute;z-index:0;color:#F6C453;animation:spark 3s ease-in-out infinite}
@keyframes cardL{0%,100%{transform:rotate(-14deg) translateY(0)}50%{transform:rotate(-11deg) translateY(-16px)}}
@keyframes cardR{0%,100%{transform:rotate(14deg) translateY(-10px)}50%{transform:rotate(11deg) translateY(8px)}}
@keyframes orb{0%,100%{filter:drop-shadow(0 0 10px #A78BFA)}50%{filter:drop-shadow(0 0 34px #D8B4FE)}}

/* ---------- QR slide ---------- */
.qrs{height:1720px;display:flex;flex-direction:column;align-items:center;padding-top:10px}
.qrs .hd{text-align:center}
.qrs .hd h1{font-family:var(--serif);font-weight:400;font-size:104px;line-height:1}
.qrs .hd h2{font-family:var(--serif);font-weight:400;font-size:48px;color:var(--gold);margin-top:10px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:40px;width:100%;margin-top:46px}
.card{position:relative;border-radius:34px;padding:6px;animation:glow 2.6s ease-in-out infinite}
.card.ig{background:linear-gradient(135deg,#FEDA75,#FA7E1E,#D62976,#962FBF,#4F5BD5)}
.card.gg{background:linear-gradient(135deg,#D9AE55,#F4ECD9,#D9AE55);animation-delay:1.3s}
.card .in{background:var(--deep);border-radius:29px;padding:34px 28px 30px;text-align:center;height:100%}
.card .code{background:#fff;border-radius:22px;padding:18px;width:390px;height:390px;margin:0 auto}
.card .code svg{width:100%;height:100%;display:block}
.card .big{font-family:var(--serif);font-size:52px;margin-top:24px;line-height:1.05}
.card .sm{font-size:25px;color:var(--dim);margin-top:8px}
.stars{font-size:46px;color:var(--gold);letter-spacing:6px;margin-top:14px}
.stars span{display:inline-block;animation:star 2.2s ease-in-out infinite}
.stars span:nth-child(2){animation-delay:.15s}.stars span:nth-child(3){animation-delay:.3s}
.stars span:nth-child(4){animation-delay:.45s}.stars span:nth-child(5){animation-delay:.6s}
.handle{display:inline-block;margin-top:14px;font-size:34px;font-weight:700;color:#fff;
  background:linear-gradient(90deg,#FA7E1E,#D62976,#962FBF);padding:8px 22px;border-radius:40px}
.deliv{width:100%;margin-top:54px;border-top:2px solid var(--gold-soft);padding-top:34px}
.deliv .t{display:flex;justify-content:space-between;align-items:baseline}
.deliv .t b{font-family:var(--serif);font-weight:400;font-size:46px;color:var(--gold)}
.deliv .t span{font-size:24px;color:var(--dim)}
.drow{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:26px}
.dq{display:flex;align-items:center;gap:22px;background:rgba(244,236,217,.06);border-radius:24px;padding:20px}
.dq .code{width:200px;height:200px;background:#fff;border-radius:16px;padding:10px;flex:none}
.dq .code svg{width:100%;height:100%;display:block}
.dq .nm{font-family:var(--serif);font-size:44px}
.dq .s{font-size:22px;color:var(--dim);margin-top:6px}
.dq.wolt .nm{color:#4FC3F7}.dq.bolt .nm{color:#34D186}
.thanks{display:flex;align-items:center;gap:30px;margin-top:auto;margin-bottom:40px}
.qpanda{width:240px;height:264px}
.thanks .a{font-family:var(--serif);font-size:56px}
.thanks .b{font-size:28px;color:var(--gold);margin-top:6px}
@keyframes glow{0%,100%{box-shadow:0 0 0 rgba(217,174,85,0)}50%{box-shadow:0 0 50px rgba(236,122,44,.55)}}
@keyframes star{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}

/* ---------- peeking panda ---------- */
#peek{position:absolute;right:-50px;bottom:120px;width:160px;height:176px;transform:translateX(220px);
  transition:transform 1s cubic-bezier(.3,1.4,.5,1);z-index:5}
#peek.in{transform:translateX(0) rotate(-8deg)}

/* ---------- panda animation ---------- */
.blink{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
.head{transform-box:view-box;transform-origin:260px 330px;animation:bob 3s ease-in-out infinite}
.arm{transform-box:view-box;transform-origin:380px 410px;animation:cheers 3s ease-in-out infinite}
.wave{transform-box:view-box;transform-origin:150px 190px;animation:wave 1.2s ease-in-out infinite}
.spark{transform-box:fill-box;transform-origin:center;animation:spark 2s ease-in-out infinite}
.spark.s2{animation-delay:.7s}.spark.s3{animation-delay:1.3s}

@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes bob{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes cheers{0%,100%{transform:rotate(0)}40%,60%{transform:rotate(-18deg)}}
@keyframes wave{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(22deg)}}
@keyframes spark{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes pulse{50%{opacity:.25}}

/* ---------- live menu sync ---------- */
.it.sold{opacity:.4}
.it.sold .pr{text-decoration:line-through;text-decoration-color:var(--orange)}
.tag.so{background:var(--dim);color:var(--deep)}

/* ---------- payment screen (from order app) ---------- */
#pay{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;padding:56px 70px 60px;
  background:radial-gradient(ellipse 1000px 700px at 50% -8%,rgba(217,174,85,.16),transparent 70%),var(--forest);
  opacity:0;transform:translateY(30px);transition:opacity .6s ease,transform .6s ease;pointer-events:none}
#pay.on{opacity:1;transform:none}
#pay .top{margin-bottom:28px}
.pmeta{font-size:30px;color:var(--dim);margin-bottom:22px}
.pmeta b{color:var(--cream);font-weight:600}
.pmeta em{font-style:normal;color:var(--gold);font-weight:600}
.plist{flex:1;min-height:0;overflow:hidden;border-top:2px solid rgba(217,174,85,.35)}
.prow{display:grid;grid-template-columns:90px 1fr auto;gap:18px;align-items:baseline;padding:20px 0;border-bottom:1px solid rgba(217,174,85,.2);
  animation:rowin .45s ease both}
.prow .q{font-family:var(--serif);font-size:38px;color:var(--gold)}
.prow .n{font-size:36px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .n small{font-size:26px;color:var(--dim);font-weight:400;margin-left:10px}
.prow .p{font-family:var(--serif);font-size:38px;white-space:nowrap}
.prow.gift .n,.prow.gift .p{color:#9BD04F}
.pmore{font-size:28px;color:var(--dim);padding-top:14px}
@keyframes rowin{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:none}}
.ptot{margin-top:30px;display:flex;justify-content:space-between;align-items:center;background:var(--deep);border:3px solid var(--gold);
  border-radius:34px;padding:34px 44px}
.ptot .l{font-family:var(--serif);font-size:54px;line-height:1}
.ptot .l small{display:block;font-family:var(--sans);font-size:28px;color:var(--dim);margin-top:6px}
.ptot .v{font-family:var(--serif);font-size:150px;line-height:.9;color:var(--gold)}
.ploy{margin-top:26px;border-radius:30px;padding:28px 40px;background:rgba(155,208,79,.1);border:2px solid rgba(155,208,79,.4);font-size:30px}
.ploy b{font-family:var(--serif);font-weight:400;font-size:40px;color:var(--gold)}
.pst{display:flex;gap:16px;margin-top:18px}
.pst i{width:72px;height:72px;border-radius:50%;border:3px solid rgba(244,236,217,.3);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:38px}
.pst i.on{background:#9BD04F;border-color:#9BD04F}
.pgift{margin-top:14px;color:#9BD04F;font-weight:700}
.phint{margin-top:26px;font-size:27px;color:var(--dim);line-height:1.45;text-align:center}
.pthx{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.pthx .qpanda{width:330px;height:363px}
.pthx h1{font-family:var(--serif);font-weight:400;font-size:150px;line-height:.95;margin-top:20px}
.pthx h2{font-family:var(--serif);font-weight:400;font-size:70px;color:var(--gold);margin-top:10px}
.pthx .amt{font-size:40px;color:var(--dim);margin-top:24px}
.pthx .gq{display:flex;align-items:center;gap:34px;margin-top:60px;text-align:left}
.pthx .gq .code{width:300px;height:300px;background:#fff;border-radius:24px;padding:16px;flex:none}
.pthx .gq .code svg{width:100%;height:100%;display:block}
.pthx .gq b{display:block;font-family:var(--serif);font-weight:400;font-size:52px}
.pthx .gq .rv{display:block;font-size:28px;color:var(--dim);margin-top:8px}
.pthx .gq .stars{font-size:44px}
#cf{position:absolute;inset:0;z-index:21;pointer-events:none}
/* login (shown once on the display computer) */
.login{position:fixed;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.9);z-index:50;cursor:auto;font-size:18px}
.login form{background:var(--deep);border:1px solid var(--gold-soft);border-radius:20px;padding:28px;width:min(420px,92vw);display:grid;gap:12px}
.login h2{font-family:var(--serif);font-weight:400;color:var(--gold)}
.login p{color:var(--dim);font-size:15px;line-height:1.4}
.login input{font:inherit;color:var(--cream);background:rgba(255,255,255,.08);border:1px solid var(--gold-soft);border-radius:12px;padding:12px}
.login button{font:inherit;font-weight:700;background:var(--gold);color:var(--deep);border:0;border-radius:12px;padding:14px;cursor:pointer}
.login .err{color:#ffab91}
.login[hidden]{display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="stage">
  <div id="fx"></div>
  <div id="slides"></div>

  const rib = p.ck ? `<div class="rib"><span>Kokteiļu stunda tagad!</span><span>Cocktail Hour now!</span></div>` : "";

function autoFit(){document.querySelectorAll(".slide .body").forEach(b=>{
  b.style.zoom=1; const avail=1790-b.offsetTop-30; const h=b.scrollHeight;
  let z=Math.min(1.45,avail/h); b.style.zoom=z;
  const s=b.parentElement; while(s.scrollHeight>1791 && z>0.7){z-=0.02; b.style.zoom=z;}});}
buildSlides();

/* ---------- cocktail hour state ---------- */
function hhState(){
  const d=new Date(), h=d.getHours()+d.getMinutes()/60;
  const end = hhEnd(d.getDay()), on = h>=HH.start && h<end;
  let txt;
  if(on){
    const left=Math.round((end-h)*60);
    txt=`Tagad! / Now on! Vēl ${Math.floor(left/60)} h ${left%60} min`;
  }else{
    let mins=Math.round(((HH.start-h)+(h>=end?24:0))*60);
    txt=`Sākas pēc / Starts in ${Math.floor(mins/60)} h ${mins%60} min`;
  }
  document.body.classList.toggle("hh",on);
  document.querySelectorAll(".it.hhi .now").forEach(x=>x.textContent = on ? HH.price : x.dataset.p);
  document.querySelectorAll(".stx").forEach(x=>x.textContent=txt);
  document.getElementById("clock").textContent=d.toLocaleTimeString("lv-LV",{hour:"2-digit",minute:"2-digit"});
}
hhState(); setInterval(hhState,15000);

const peek=document.getElementById("peek");
let cur=0, timers=[];
function show(i){
  timers.forEach(clearTimeout); timers=[];
  slides.forEach((s,k)=>s.classList.toggle("show",k===i));
  
  document.body.classList.toggle("fpon",!!PLAN[i].fp);
  const isHero=!!PLAN[i].hero, isQR=!!(PLAN[i].qr||PLAN[i].fp);
  const dur=(PLAN[i].sec||SLIDE_SECONDS)*1000;
  peek.classList.remove("in");
  if(!isHero && !isQR){ timers.push(setTimeout(()=>peek.classList.add("in"),4000), setTimeout(()=>peek.classList.remove("in"),8000)); }
  timers.push(setTimeout(()=>{cur=(cur+1)%slides.length;show(cur)},dur));
}
show(0);

  (function f(t){x.clearRect(0,0,1080,1920);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.a+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});
    if(t-t0<4500)requestAnimationFrame(f);else x.clearRect(0,0,1080,1920)})(t0);
}

}

document.addEventListener("visibilitychange",()=>{if(!document.hidden)wake()});wake();
