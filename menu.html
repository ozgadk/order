<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Snuggest · Menu</title>
<meta name="theme-color" content="#2a1d15">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#170f0b;--bg2:#1f150f;--panel:#261a13;--panel2:#352419;--ink:#fbf0dc;--muted:#bba184;
  --gold:#f1b94a;--line:#3d2b1f;--danger:#ff7a6b;--acc:#f1b94a;
  --serif:"Alegreya",Georgia,serif;--sans:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;-webkit-text-size-adjust:100%;text-size-adjust:100%;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;-webkit-tap-highlight-color:transparent;padding-bottom:calc(100px + env(safe-area-inset-bottom,0px));
  background-image:radial-gradient(900px 500px at 110% -10%,rgba(255,93,115,.16),transparent 60%),radial-gradient(700px 500px at -20% 20%,rgba(79,195,247,.10),transparent 60%);background-attachment:fixed}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto}

/* hero */
header.hero{position:relative;overflow:hidden;padding:calc(20px + env(safe-area-inset-top,0px)) 16px 22px;
  background:linear-gradient(135deg,#2b1a10 0%,#3a1e22 55%,#1d2433 100%)}
header.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;
  background:linear-gradient(90deg,#9bd04f,#4fd1b5,#4fc3f7,#b07cff,#ff5d73,#ffb23f,#f1b94a)}
.hero .wrap{position:relative;display:flex;align-items:flex-start;gap:12px}
.brand{margin-right:auto}
.brand small{display:block;letter-spacing:.45em;font-size:11px;color:var(--gold)}
.brand b{display:block;font-family:var(--serif);font-size:34px;line-height:1;letter-spacing:.03em;
  background:linear-gradient(90deg,#fff3d6,#f1b94a 45%,#ffd38a 55%,#fff3d6);-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200% 100%;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:-200% 0}}
.brand span{display:block;font-size:14px;color:var(--muted);margin-top:6px}
.langs{display:flex;gap:2px;background:rgba(255,255,255,.08);border-radius:10px;padding:3px}
.langs button{padding:6px 10px;border-radius:8px;font-weight:700;font-size:14px;color:var(--muted)}
.langs button[aria-pressed="true"]{background:var(--gold);color:#1a110b}
.tbl[hidden]{display:none}
.tbl{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:rgba(241,185,74,.14);border:1px solid rgba(241,185,74,.45);border-radius:999px;padding:5px 14px 5px 6px;font-weight:700;color:#ffe2a8}
.tbl i{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--gold);color:#1a110b;font-style:normal;font-size:14px}
.bubbles{position:absolute;inset:0;pointer-events:none}
.bubbles span{position:absolute;bottom:-12px;width:8px;height:8px;border-radius:50%;border:1.5px solid rgba(255,243,214,.35);animation:rise 7s linear infinite}
@keyframes rise{to{transform:translateY(-190px) translateX(10px);opacity:0}}

/* cocktail hour banner */
.hh{margin:14px 16px 0}
.hh button{position:relative;overflow:hidden;display:block;width:100%;max-width:640px;margin:0 auto;text-align:left;border-radius:16px;padding:14px 16px;color:#1a0d10;
  background:linear-gradient(110deg,#ff5d73,#ffb23f,#f1b94a,#ff5d73);background-size:300% 100%;animation:hhflow 5s ease infinite;box-shadow:0 8px 26px rgba(255,93,115,.28)}
@keyframes hhflow{50%{background-position:100% 0}}
.hh b{display:block;font-family:var(--serif);font-size:24px;line-height:1.1}
.hh small{display:block;font-weight:700;font-size:15px;margin-top:3px;opacity:.85}
.hh .spark{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:34px;animation:wob 1.6s ease-in-out infinite}
@keyframes wob{50%{transform:translateY(-50%) rotate(14deg) scale(1.12)}}

/* category nav */
nav.cats{position:sticky;top:0;z-index:5;background:rgba(23,15,11,.92);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
nav.cats::-webkit-scrollbar{display:none}
nav.cats .wrap{display:flex;gap:6px;padding:10px 16px;width:max-content;min-width:100%}
nav.cats button{white-space:nowrap;padding:8px 14px;border-radius:999px;background:var(--panel2);color:var(--muted);font-weight:700;border:1px solid transparent}
nav.cats button[aria-current="true"]{background:var(--acc);color:#1a110b}

/* sections & items */
main{padding:0 16px}
section.cat{padding-top:22px;scroll-margin-top:60px}
section.cat h2{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:25px;margin:4px 0 12px;color:var(--acc)}
section.cat h2 i{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;font-style:normal;font-size:22px;background:color-mix(in srgb,var(--acc) 18%,transparent);border:1px solid color-mix(in srgb,var(--acc) 45%,transparent)}
.it{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px 12px 18px;margin-bottom:10px;overflow:hidden}
.it::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--acc);opacity:.85}
.it.has{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),0 6px 20px color-mix(in srgb,var(--acc) 22%,transparent)}
.it .nm{font-weight:700;font-size:18px;line-height:1.2}
.vr{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-top:10px}
.vr+.vr{padding-top:10px;border-top:1px dashed var(--line)}
.vp{flex:1 1 90px;min-width:0;line-height:1.25;overflow-wrap:anywhere}
.vp b{display:block;font-weight:500}
.vp span{color:var(--acc);font-weight:700}
.stp{display:flex;align-items:center;gap:2px;flex:none;margin-left:auto}
.stp button{width:42px;height:42px;border-radius:12px;background:var(--panel2);font-size:22px;line-height:1}
.stp .add{background:var(--acc);color:#1a110b;font-weight:700}
.stp button:disabled{opacity:.3;cursor:default}
.stp .cn{min-width:28px;text-align:center;font-weight:700}
.stp .cn.z{color:var(--muted);font-weight:400}
.pop{animation:pop .35s ease}
@keyframes pop{40%{transform:scale(1.45)}}

/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 35%)}
.bar button{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:640px;margin:0 auto;border-radius:16px;padding:16px 18px;font-weight:700;font-size:18px;color:#1a110b;
  background:linear-gradient(90deg,#f1b94a,#ffb23f);box-shadow:0 8px 26px rgba(241,185,74,.35)}
.bar button.bump{animation:bump .4s ease}
@keyframes bump{40%{transform:translateY(-5px) scale(1.03)}}

/* sheet */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(8,4,2,.65);display:flex;align-items:flex-end;justify-content:center}
.sheet .in{background:var(--bg2);border-top:4px solid var(--gold);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 16px calc(16px + env(safe-area-inset-bottom,0px));animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h3{font-family:var(--serif);font-size:27px;margin:0 0 4px;color:var(--gold)}
.sheet .sub{color:var(--muted);margin:0 0 12px}
.ln{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.ln .t{flex:1 1 120px;min-width:0;line-height:1.25}
.ln .t span{color:var(--muted);font-size:14px}
.ln .p{font-weight:700;min-width:64px;text-align:right}
.ln .stp{margin-left:0}
.tot{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0}
.tot b{font-family:var(--serif);font-size:32px;color:var(--gold)}
.btn{display:block;width:100%;padding:15px;border-radius:14px;background:var(--panel2);font-weight:700;font-size:17px;margin-top:8px}
.btn.primary{background:linear-gradient(90deg,#f1b94a,#ffb23f);color:#1a110b}
.btn:disabled{opacity:.5}
.err{color:var(--danger);margin:8px 0 0}
.center{text-align:center;padding:60px 24px;color:var(--muted)}
.center h2{font-family:var(--serif);color:var(--ink);font-size:28px;margin:0 0 8px}
.ok{font-size:56px;line-height:1;margin-bottom:8px}

.hr{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.loyb{font-size:13px;font-weight:700;color:#ffe2a8;background:rgba(241,185,74,.14);border:1px solid rgba(241,185,74,.45);border-radius:999px;padding:5px 10px;white-space:nowrap}
.it.out{opacity:.5}
.sold{font-style:normal;font-size:12px;font-weight:700;color:#1a110b;background:var(--danger);border-radius:6px;padding:2px 6px;margin-left:4px;vertical-align:2px}
.evs{display:grid;gap:10px}
.ev{display:flex;gap:12px;align-items:flex-start;background:linear-gradient(120deg,rgba(176,124,255,.18),rgba(255,93,115,.12));border:1px solid rgba(176,124,255,.45);border-radius:16px;padding:14px}
.ev .ee{font-size:30px;line-height:1}
.ev b{display:block;font-size:19px;font-family:var(--serif)}
.ev .ew{display:inline-block;margin-top:4px;font-weight:700;color:#d9c2ff;font-size:15px}
.ev p{margin:6px 0 0;color:var(--muted);line-height:1.35}
.ft{display:grid;gap:10px;padding:30px 0 10px}
.fl{display:block;text-align:center;padding:14px;border-radius:14px;font-weight:700;text-decoration:none;color:var(--ink);background:var(--panel);border:1px solid var(--line)}
.fl.g{border-color:rgba(255,209,102,.5)}
.fl.i{background:linear-gradient(90deg,rgba(255,93,115,.18),rgba(176,124,255,.18));border-color:rgba(255,93,115,.45)}
.fl.l{width:100%;border-color:rgba(241,185,74,.5)}
.nl{display:grid;gap:6px;color:var(--muted);font-size:14px;margin-top:6px}
.tx{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%;min-width:0}
textarea.tx{resize:vertical}
a.btn{text-align:center;text-decoration:none;color:var(--ink)}
.btn.rv{border:1px solid rgba(255,209,102,.5)}
.btn.ig{background:linear-gradient(90deg,rgba(255,93,115,.22),rgba(176,124,255,.22))}
.card{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center}
.dots{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:300px;margin:0 auto 10px}
.dot{aspect-ratio:1;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font-size:20px}
.dot.on{border:2px solid var(--gold);background:rgba(241,185,74,.15)}
.fr{color:var(--gold)}
#sug{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;justify-content:center}
#sug[hidden]{display:none}
.sg{display:flex;align-items:center;gap:10px;width:100%;max-width:616px;background:var(--bg2);border:1px solid var(--acc);border-radius:16px;padding:10px 10px 10px 12px;box-shadow:0 10px 30px rgba(0,0,0,.45);animation:up .3s ease}
.sg .se{font-size:26px}
.sg .st{flex:1;min-width:0;line-height:1.2}
.sg .st small{display:block;color:var(--acc);font-weight:700;font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.sg .st b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sg .st span{color:var(--muted);font-size:14px}
.sg .sa{background:var(--acc);color:#1a110b;font-weight:700;border-radius:10px;padding:10px 12px;white-space:nowrap}
.sg .sx{width:34px;height:34px;border-radius:10px;background:var(--panel2);color:var(--muted)}
/* fortune banner */
.fb{position:relative;display:flex;align-items:center;gap:12px;width:100%;margin:18px 0 0;padding:10px 14px 10px 8px;border-radius:18px;text-align:left;overflow:hidden;
  background:linear-gradient(120deg,#3a1666,#5b1f74 50%,#2a0f5c);border:1px solid rgba(201,166,255,.55);box-shadow:0 8px 28px rgba(138,77,255,.35)}
.fb::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.18) 50%,transparent 70%);transform:translateX(-100%);animation:fshine 4.5s ease-in-out infinite}
@keyframes fshine{60%,100%{transform:translateX(100%)}}
.fb .fmini{width:78px;flex:none}
.fb .fmini svg{width:100%;height:auto;display:block}
.fb b{display:block;font-family:var(--serif);font-size:20px;line-height:1.15;color:#fff3d6}
.fb small{display:block;color:#d9c2ff;font-weight:700;margin-top:3px}
/* overlay */
body.noscroll{overflow:hidden}
#fortune{position:fixed;inset:0;z-index:35;overflow:auto;color:#fff3d6;
  background:radial-gradient(circle at 50% 25%,#4a1d7a 0%,#200b3d 55%,#0d0518 100%)}
.fwrap{position:relative;min-height:100%;max-width:520px;margin:0 auto;padding:calc(54px + env(safe-area-inset-top,0px)) 20px calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;text-align:center}
.fstars{position:fixed;inset:0;pointer-events:none;opacity:.8;
  background-image:radial-gradient(2px 2px at 20% 30%,#fff,transparent),radial-gradient(1.5px 1.5px at 70% 20%,#ffd96b,transparent),radial-gradient(1.5px 1.5px at 40% 70%,#fff,transparent),radial-gradient(2px 2px at 85% 60%,#fff,transparent),radial-gradient(1.5px 1.5px at 10% 85%,#ffd96b,transparent),radial-gradient(1.5px 1.5px at 60% 90%,#fff,transparent),radial-gradient(2px 2px at 92% 8%,#fff,transparent),radial-gradient(1.5px 1.5px at 33% 12%,#ffd96b,transparent);
  animation:twinkle 4s ease-in-out infinite alternate}
@keyframes twinkle{to{opacity:.35}}
.fx{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;z-index:2;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff3d6;font-size:18px}
.fart{position:relative}
.fart.big{width:min(300px,78vw);animation:fin .8s cubic-bezier(.2,1.3,.4,1) both}
.fart.small{width:150px;animation:fin .5s ease both}
.fart svg{width:100%;height:auto;display:block;overflow:visible}
@keyframes fin{from{opacity:0;transform:translateY(30px) scale(.9)}}
.ftitle{font-family:var(--serif);font-size:34px;margin:8px 0 6px;background:linear-gradient(90deg,#ffd96b,#ff8cc0,#c9a6ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.fintro{color:#e3d2ff;line-height:1.45;margin:0 0 22px;font-size:18px;max-width:420px}
.fbtn{display:block;width:100%;max-width:400px;padding:16px;border-radius:16px;font-weight:700;font-size:18px;color:#1a0d10;margin-top:10px;
  background:linear-gradient(90deg,#ffd96b,#ff8cc0);box-shadow:0 8px 26px rgba(255,140,192,.35)}
.fbtn.ig{background:linear-gradient(90deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);color:#fff}
.fbtn.ghost{background:rgba(255,255,255,.1);color:#fff3d6;box-shadow:none;border:1px solid rgba(201,166,255,.45)}
.fmoons{display:flex;gap:10px;font-size:22px;margin:6px 0 4px}
.fmoons span{opacity:.45}.fmoons .cur,.fmoons .done{opacity:1}
.fq{font-family:var(--serif);font-size:28px;margin:8px 0 18px;animation:fin .5s .1s ease both}
.fopts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:420px}
.fopt{padding:20px 10px;border-radius:18px;font-weight:700;font-size:18px;color:#fff3d6;background:rgba(255,255,255,.08);border:1px solid rgba(201,166,255,.45);animation:fin .45s ease both}
.fopt:active{transform:scale(.96);background:rgba(201,166,255,.3)}
.fopts .fopt:nth-child(3):last-child{grid-column:1/-1}
.fread{font-family:var(--serif);font-size:26px;color:#e3d2ff;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.4}}
/* panda svg animations */
.fpanda .feyes{transform-origin:160px 143px;animation:blink 4.5s infinite}
@keyframes blink{0%,46%,50%,100%{transform:scaleY(1)}48%{transform:scaleY(.1)}}
.fpanda .fglow{transform-origin:160px 268px;animation:glow 2.4s ease-in-out infinite}
@keyframes glow{50%{transform:scale(1.12);opacity:.7}}
.fpanda .fmist{transform-origin:160px 268px;animation:spin 7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fpanda .fsp path{transform-box:fill-box;transform-origin:center;animation:tw 2.2s ease-in-out infinite}
@keyframes tw{50%{transform:scale(.4) rotate(45deg);opacity:.4}}
.fpanda .fpaws{animation:hover 2.4s ease-in-out infinite}
@keyframes hover{50%{transform:translateY(-5px)}}
.fpanda .ffeather{transform-box:fill-box;transform-origin:0% 100%;animation:sway 3s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(-8deg)}}
.fpanda .fgem{animation:gem 2s ease-in-out infinite}
@keyframes gem{50%{filter:brightness(1.6)}}
.reading .fpanda .fmist{animation-duration:1.2s}
.reading .fpanda .fglow{animation-duration:.6s}
.reading .fpanda .fpaws{animation:rub .35s ease-in-out infinite}
@keyframes rub{50%{transform:translate(4px,-4px)}}
.reading .fpanda .fpup{animation:look 1s ease-in-out infinite}
@keyframes look{50%{transform:translateY(3px)}}
/* reveal card */
.fcard{position:relative;width:min(330px,86vw);aspect-ratio:3/4.6;perspective:1200px;margin:6px 0 10px}
.fin{position:absolute;inset:0;transform-style:preserve-3d;animation:flip 1.1s .25s cubic-bezier(.3,1.4,.5,1) both}
@keyframes flip{from{transform:rotateY(180deg) scale(.8)}}
.fback,.ffront{position:absolute;inset:0;border-radius:24px;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:4px solid #f1b94a;box-shadow:0 0 50px rgba(176,124,255,.6)}
.fback{transform:rotateY(180deg);display:grid;place-items:center;font-size:70px;
  background:repeating-linear-gradient(45deg,#2a0f5c 0 14px,#3a1666 14px 28px)}
.ffront{background:linear-gradient(180deg,#2d1157,#190833);padding:22px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.ffront::before{content:"";position:absolute;inset:10px;border:1.5px solid rgba(241,185,74,.6);border-radius:16px;pointer-events:none}
.ffront small{letter-spacing:.2em;text-transform:uppercase;color:#d9c2ff;font-weight:700;font-size:12px}
.fem{font-size:66px;line-height:1.1;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
.ffront h3{font-family:var(--serif);font-size:30px;margin:2px 0;color:#fff3d6;line-height:1.1}
.fpr{color:#ffd96b;font-weight:700}
.fhh{display:inline-block;background:linear-gradient(90deg,#ff5d73,#ffb23f);color:#1a0d10;border-radius:999px;padding:3px 12px}
.ffront p{font-family:var(--serif);font-style:italic;font-size:18px;line-height:1.4;color:#ffe2a8;margin:10px 0 0}
.fspk{position:absolute;left:50%;top:40%;font-style:normal;color:#ffd96b;font-size:20px;pointer-events:none;opacity:0;animation:spk 1.3s ease-out forwards}
@keyframes spk{0%{opacity:1;transform:translate(-50%,-50%) scale(.3)}100%{opacity:0;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1.2) rotate(90deg)}}
.fbtns{width:100%;display:flex;flex-direction:column;align-items:center}
.fmsg{color:#d9c2ff;min-height:1.2em}

[hidden]{display:none!important}
/* welcome splash */
#splash{position:fixed;inset:0;z-index:50;display:grid;place-items:center;text-align:center;padding:24px;
  background:radial-gradient(circle at 50% 40%,#3a1e22,#170f0b 70%);transition:opacity .5s ease,visibility .5s}
#splash.out{opacity:0;visibility:hidden}
#splash svg{width:120px;height:150px;overflow:visible}
#splash .liq{transform-origin:50% 100%;animation:fill 1.4s .2s ease-out both}
@keyframes fill{from{transform:scaleY(0)}}
#splash .bb{animation:bub 1.6s ease-in infinite;opacity:0}
@keyframes bub{0%{opacity:0;transform:translateY(0)}20%{opacity:1}100%{opacity:0;transform:translateY(-46px)}}
#splash .ol{animation:drop .6s 1.2s cubic-bezier(.3,1.6,.5,1) both}
@keyframes drop{from{transform:translateY(-60px);opacity:0}}
#splash .w{margin-top:18px;font-family:var(--serif);font-size:30px;color:#fff3d6;animation:fadeup .7s .5s ease both}
#splash .w small{display:block;font-family:var(--sans);letter-spacing:.45em;font-size:12px;color:var(--gold);margin-bottom:6px}
#splash .g{margin-top:10px;font-size:18px;color:var(--muted);animation:fadeup .7s .9s ease both}

#hhpop span{display:block;font-size:26px;margin-top:6px}
@keyframes zoom{0%{transform:scale(.2);opacity:0}15%{transform:scale(1);opacity:1}80%{opacity:1}100%{opacity:0;transform:scale(1.08)}}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function catVisible(c,d=new Date()){
  if(!c.hh)return true;const t=d.getHours()*60+d.getMinutes(),f=toMin(c.hh.from),e=toMin(c.hh.to),day=d.getDay();
  if(isNaN(f)||isNaN(e))return false;

  if(t>=f)return c.hh.days.includes(day);

/* ---------- render ---------- */

function visibleCats(){const v=menu.cats.filter(c=>c.items.length&&catVisible(c));return[...v.filter(c=>c.hh),...v.filter(c=>!c.hh)]}
function render(){
  renderLangs();
  if(table){$('#tbl').hidden=false;$('#tbl').innerHTML=`<i>${esc(table)}</i>${esc(tx('table'))}`}
  if(!menu)return;
  const cats=visibleCats(),hh=cats.find(c=>c.hh);

  const q=Math.max(0,Math.min(20,(cart[k]||0)+d));if(q)cart[k]=q;else delete cart[k];saveCart();

const ft=k=>FT[lang][k];

const FCATS=['hh','c0','c1','c2','c4','c5','c6'];
let fort=null;
function fortPool(){
  const out=[];
  for(const c of menu.cats){
    if(!FCATS.includes(c.id)||!catVisible(c))continue;
    for(const it of c.items){
      if(it.out||!it.v.length||/virgin/i.test(it.name))continue;
      const pr=PROF[it.name]||(c.id==='c5'?[[1,0],3,0]:c.id==='c4'?[[0],1,1]:c.id==='c6'?[[1,2],2,0]:[[0],1,1]);
      out.push({c,it,v:it.v[0],pr});
    }
  }
  return out;
}
function fortRank(){
  const [e,t,s]=fort.ans,pool=fortPool();
  pool.forEach(x=>{x.sc=(x.pr[0].includes(e)?3:0)+(x.pr[1]===t?3:0)+(x.pr[2]===s?2:Math.abs(x.pr[2]-s)===1?1:0)+(x.c.hh?.6:0)+Math.random()*1.4});
  pool.sort((a,b)=>b.sc-a.sc);
  // prefer the cocktail-hour version of a name when both exist
  const seen=new Set();return pool.filter(x=>{if(seen.has(x.it.name))return false;seen.add(x.it.name);return true});
}
const BEERC=['Istanbul City','Antalya Sun','Anatolian','Troia','Mexican'];
function fortEmoji(x){return BEERC.includes(x.it.name)?'🍺':x.c.id==='c6'?(/prosecco/i.test(x.it.name)?'🥂':'🍷'):x.c.id==='c5'||x.c.id==='c2'?'🍺':x.c.id==='c4'?'🥃':/martini|espresso/i.test(x.it.name)?'🍸':'🍹'}
function fortText(x){const a=ft('f')[fort.ans[0]];return a[fort.n%a.length].replace('{d}',x.it.name)}
function openFortune(){fort={step:0,ans:[],n:0,shown:new Set(),pick:null};document.body.classList.add('noscroll');renderFortune()}
function closeFortune(){fort=null;$('#fortune').innerHTML='';$('#fortune').hidden=true;document.body.classList.remove('noscroll')}
function renderFortune(){
  const el=$('#fortune');el.hidden=false;
  const top=`<button class="fx" data-act="fclose" aria-label="${esc(tx('close'))}">✕</button><div class="fstars" aria-hidden="true"></div>`;
  if(fort.step===0){
    el.innerHTML=`<div class="fwrap">${top}<div class="fart big">${pandaSVG('fpa')}</div>
      <h2 class="ftitle">${esc(ft('title'))}</h2><p class="fintro">${esc(ft('intro'))}</p>
      <button class="fbtn" data-act="fstart">🔮 ${esc(ft('start'))}</button></div>`;
  }else if(fort.step<=3){
    const [q,opts]=ft('q')[fort.step-1];
    el.innerHTML=`<div class="fwrap">${top}<div class="fart small">${pandaSVG('fpb')}</div>
      <div class="fmoons">${[1,2,3].map(i=>`<span class="${i<fort.step?'done':i===fort.step?'cur':''}">${i<fort.step?'🌕':i===fort.step?'🌓':'🌑'}</span>`).join('')}</div>
      <h2 class="fq">${esc(q)}</h2>
      <div class="fopts">${opts.map((o,i)=>`<button class="fopt" data-act="fans" data-i="${i}" style="animation-delay:${i*70}ms">${esc(o)}</button>`).join('')}</div></div>`;
  }else if(fort.step===4){
    el.innerHTML=`<div class="fwrap reading">${top}<div class="fart big">${pandaSVG('fpc')}</div><p class="fread">${esc(ft('reading'))}</p></div>`;
    clearTimeout(fort.t);fort.t=setTimeout(()=>{if(!fort)return;fortChoose();fort.step=5;renderFortune()},2600);
  }else{
    const x=fort.pick;if(!x){closeFortune();return}
    const price=eur(cents(x.v.p));
    el.innerHTML=`<div class="fwrap">${top}
      <div class="fcard" id="fcard"><div class="fin">
        <div class="fback"><span>🔮</span></div>

          <small>${esc(ft('your'))}</small>

          <div class="fpr">${x.c.hh?`<b class="fhh">${esc(ft('hh'))}</b>`:esc(price)}${x.v.l&&!x.c.hh?` · ${esc(x.v.l)}`:''}</div>
          <p>“${esc(fortText(x))}”</p>
        </div></div></div>
      <div class="fbtns">
        ${table?`<button class="fbtn" data-act="fadd">✨ ${esc(ft('add'))}</button>`:''}
        <button class="fbtn ig" data-act="fshare">📸 ${esc(ft('share'))}</button>
        <button class="fbtn ghost" data-act="fagain">🔮 ${esc(ft('again'))}</button>
      </div><p class="fmsg" id="fmsg"></p></div>`;
    if(!RM){burstSparks()}
  }
}
function fortChoose(){
  const r=fortRank();let x=r.find(y=>!fort.shown.has(y.it.name));
  if(!x){fort.shown.clear();x=r[0]}
  if(x)fort.shown.add(x.it.name);fort.pick=x||null;fort.n++;
}
function burstSparks(){
  const c=$('#fcard');if(!c)return;
  for(let i=0;i<18;i++){const s=document.createElement('i');s.className='fspk';const a=Math.random()*Math.PI*2,d=110+Math.random()*90;
    s.style.setProperty('--x',Math.cos(a)*d+'px');s.style.setProperty('--y',Math.sin(a)*d+'px');s.style.animationDelay=(.55+Math.random()*.3)+'s';
    s.textContent=['✦','✧','★','✨'][i%4];c.appendChild(s);setTimeout(()=>s.remove(),2400)}
}
/* ---------- Instagram story image ---------- */
function wrapLines(ctx,text,maxW){const words=text.split(' '),lines=[];let cur='';for(const w of words){const t=cur?cur+' '+w:w;if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w}else cur=t}if(cur)lines.push(cur);return lines}
async function storyImage(x){
  const W=1080,H=1920,cv=document.createElement('canvas');cv.width=W;cv.height=H;const g=cv.getContext('2d');
  try{await document.fonts.ready}catch(e){}
  let bg=g.createRadialGradient(W/2,700,50,W/2,800,1300);bg.addColorStop(0,'#4a1d7a');bg.addColorStop(.55,'#200b3d');bg.addColorStop(1,'#0d0518');
  g.fillStyle=bg;g.fillRect(0,0,W,H);
  // stars
  let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  for(let i=0;i<160;i++){g.globalAlpha=.25+rnd()*.7;g.fillStyle=rnd()<.2?'#ffd96b':'#ffffff';g.beginPath();g.arc(rnd()*W,rnd()*H,rnd()*2.6+.6,0,7);g.fill()}
  g.globalAlpha=1;
  // rainbow brand strip
  const cols=['#9bd04f','#4fd1b5','#4fc3f7','#b07cff','#ff5d73','#ffb23f','#f1b94a'];cols.forEach((c,i)=>{g.fillStyle=c;g.fillRect(i*W/cols.length,0,W/cols.length+1,14)});
  g.textAlign='center';
  g.fillStyle='#f1b94a';g.font='600 34px "Alegreya Sans", sans-serif';g.fillText('T  H  E',W/2,110);
  g.fillStyle='#fff3d6';g.font='700 92px Alegreya, Georgia, serif';g.fillText('SNUGGEST',W/2,196);
  g.fillStyle='#d9c2ff';g.font='500 44px "Alegreya Sans", sans-serif';g.fillText('🔮 '+ft('storyTop'),W/2,270);
  // panda
  const svg=pandaSVG('fps');const img=new Image();
  await new Promise(r=>{img.onload=r;img.onerror=r;img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg.replace('<svg ','<svg width="640" height="720" '))});
  try{g.drawImage(img,(W-640)/2,300,640,720)}catch(e){}
  // card
  g.font='italic 500 40px Alegreya, Georgia, serif';const lines=wrapLines(g,'“'+fortText(x)+'”',W-220-140).slice(0,6);
  const cx=110,cy=1050,cw=W-220,chh=470+(x.c.hh?70:0)+lines.length*52+30;
  g.save();g.shadowColor='rgba(176,124,255,.6)';g.shadowBlur=60;
  const rr=(x,y,w,h,r)=>{g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()};
  const cg=g.createLinearGradient(0,cy,0,cy+chh);cg.addColorStop(0,'#2d1157');cg.addColorStop(1,'#190833');g.fillStyle=cg;rr(cx,cy,cw,chh,40);g.fill();g.restore();
  const gg=g.createLinearGradient(cx,cy,cx+cw,cy+chh);gg.addColorStop(0,'#fff1a8');gg.addColorStop(.5,'#f1b94a');gg.addColorStop(1,'#a86b12');
  g.strokeStyle=gg;g.lineWidth=8;rr(cx,cy,cw,chh,40);g.stroke();g.lineWidth=2;rr(cx+22,cy+22,cw-44,chh-44,28);g.stroke();
  g.fillStyle='#d9c2ff';g.font='600 36px "Alegreya Sans", sans-serif';g.fillText(ft('your').toUpperCase(),W/2,cy+100);
  g.font='120px serif';g.fillText(fortEmoji(x),W/2,cy+240);
  g.fillStyle='#fff3d6';g.font='700 76px Alegreya, Georgia, serif';
  let nm=x.it.name;while(g.measureText(nm).width>cw-120&&nm.length>4)nm=nm.slice(0,-2);if(nm!==x.it.name)nm=nm.trim()+'…';g.fillText(nm,W/2,cy+350);
  let ty=cy+440;
  if(x.c.hh){g.fillStyle='#ffb23f';rr(W/2-150,cy+382,300,58,29);g.fill();g.fillStyle='#1a0d10';g.font='700 34px "Alegreya Sans", sans-serif';g.fillText(ft('hh'),W/2,cy+422);ty+=70}
  g.fillStyle='#ffe2a8';g.font='italic 500 40px Alegreya, Georgia, serif';
  lines.forEach((l,i)=>g.fillText(l,W/2,ty+i*52));
  // footer
  g.fillStyle='#f1b94a';g.font='700 46px "Alegreya Sans", sans-serif';g.fillText('@thesnuggest',W/2,H-150);
  g.fillStyle='#bba184';g.font='500 34px "Alegreya Sans", sans-serif';g.fillText('Zirgu iela 3 · Vecrīga · Rīga',W/2,H-95);
  return new Promise(r=>cv.toBlob(r,'image/png'));
}
async function shareFortune(){
  const x=fort&&fort.pick;if(!x)return;const m=$('#fmsg');
  try{
    const blob=await storyImage(x);const file=new File([blob],'snuggest-fortune.png',{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'The Snuggest',text:'🔮 @thesnuggest'});return}
    const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='snuggest-fortune.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),8000);
    if(m)m.textContent=ft('saved');
  }catch(e){if(e&&e.name==='AbortError')return;if(m)m.textContent=ft('saved')}
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,k=b.dataset.k;
  if(a==='shut'){if(e.target===b)closeSheet();return}
  if(a==='add')bump(k,1);
  else if(a==='sub')bump(k,-1);
  else if(a==='cadd'||a==='csub'){const ne=$('#note');if(ne)note=ne.value;bump(k,a==='cadd'?1:-1);if(cartLines().length)openCart();else closeSheet()}
  else if(a==='cart')openCart();
  else if(a==='close')closeSheet();
  else if(a==='send')send();
  else if(a==='retry')load();
  else if(a==='boom')celebrate();
  else if(a==='loy')loySheet(null);
  else if(a==='fortune')openFortune();
  else if(a==='fclose')closeFortune();
  else if(a==='fstart'){fort.step=1;renderFortune()}
  else if(a==='fans'){fort.ans[fort.step-1]=+b.dataset.i;fort.step++;renderFortune()}
  else if(a==='fagain'){fort.step=4;renderFortune()}
  else if(a==='fshare')shareFortune();
  else if(a==='fadd'){const x=fort.pick;closeFortune();if(x)bump(ckey(x.it.id,x.v.l),1)}
  else if(a==='loygo')loyGo();
  else if(a==='sugadd'){$('#sug').hidden=true;bump(k,1)}
  else if(a==='sugx')$('#sug').hidden=true;
  else if(a==='jump'){const s=document.getElementById('cat-'+b.dataset.c);if(s)s.scrollIntoView({behavior:'smooth'})}
});
$('#langs').addEventListener('click',e=>{const b=e.target.closest('[data-lang]');if(!b)return;lang=b.dataset.lang;try{localStorage.setItem('snug.lang',lang)}catch(x){}const ne=$('#note');if(ne)note=ne.value;const y=scrollY;render();scrollTo(0,y);if($('#sheet .ln'))openCart()});
let spyT=0;
function spy(){
  const secs=[...document.querySelectorAll('section.cat')];if(!secs.length)return;
  let cur=secs[0].id;for(const s of secs)if(s.getBoundingClientRect().top<90)cur=s.id;
  document.querySelectorAll('#catbtns button').forEach(b=>{const on='cat-'+b.dataset.c===cur;if(b.getAttribute('aria-current')!==String(on)){b.setAttribute('aria-current',String(on));if(on)b.scrollIntoView({block:'nearest',inline:'center'})}});
}
addEventListener('keydown',e=>{if(e.key==='Escape'&&fort)closeFortune()});
addEventListener('scroll',()=>{if(spyT)return;spyT=requestAnimationFrame(()=>{spyT=0;spy()})},{passive:true});

/* ---------- load ---------- */
let firstLoad=true;
async function load(){
  $('#main').innerHTML='<div class="center">…</div>';
  try{
    const cfgP=window.FBC.getConfig();
    if(firstLoad){const n=parseInt(rawT,10);table=/^\d{1,3}$/.test(rawT)&&n>=1?String(n):null;await splash()}

    if(!cfg||!cfg.menu||!cfg.menu.cats)throw new Error('no menu');
    menu=cfg.menu;
    const n=parseInt(rawT,10);
    table=/^\d{1,3}$/.test(rawT)&&n>=1&&n<=(menu.tableCount||200)?String(n):null;
    for(const k of Object.keys(cart))if(!findLine(k))delete cart[k];

}
renderLangs();
if(window.FBC)load();else addEventListener('fbcready',load,{once:true});
setInterval(()=>{if(menu&&!$('#sheet').innerHTML){const y=scrollY;render();scrollTo(0,y)}},60000);
