<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Snuggest · Menu</title>
<meta name="theme-color" content="#2a1d15">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#170f0b;--bg2:#1f150f;--panel:#261a13;--panel2:#352419;--ink:#fbf0dc;--muted:#bba184;
  --gold:#f1b94a;--line:#3d2b1f;--danger:#ff7a6b;--acc:#f1b94a;
  --serif:"Alegreya",Georgia,serif;--sans:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;-webkit-text-size-adjust:100%;text-size-adjust:100%;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;-webkit-tap-highlight-color:transparent;padding-bottom:calc(100px + env(safe-area-inset-bottom,0px));
  background-image:radial-gradient(900px 500px at 110% -10%,rgba(255,93,115,.16),transparent 60%),radial-gradient(700px 500px at -20% 20%,rgba(79,195,247,.10),transparent 60%);background-attachment:fixed}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto}

/* hero */
header.hero{position:relative;overflow:hidden;padding:calc(20px + env(safe-area-inset-top,0px)) 16px 22px;
  background:linear-gradient(135deg,#2b1a10 0%,#3a1e22 55%,#1d2433 100%)}
header.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;
  background:linear-gradient(90deg,#9bd04f,#4fd1b5,#4fc3f7,#b07cff,#ff5d73,#ffb23f,#f1b94a)}
.hero .wrap{position:relative;display:flex;align-items:flex-start;gap:12px}
.brand{margin-right:auto}
.brand small{display:block;letter-spacing:.45em;font-size:11px;color:var(--gold)}
.brand b{display:block;font-family:var(--serif);font-size:34px;line-height:1;letter-spacing:.03em;
  background:linear-gradient(90deg,#fff3d6,#f1b94a 45%,#ffd38a 55%,#fff3d6);-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200% 100%;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:-200% 0}}
.brand span{display:block;font-size:14px;color:var(--muted);margin-top:6px}
.langs{display:flex;gap:2px;background:rgba(255,255,255,.08);border-radius:10px;padding:3px}
.langs button{padding:6px 10px;border-radius:8px;font-weight:700;font-size:14px;color:var(--muted)}
.langs button[aria-pressed="true"]{background:var(--gold);color:#1a110b}
.tbl[hidden]{display:none}
.tbl{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:rgba(241,185,74,.14);border:1px solid rgba(241,185,74,.45);border-radius:999px;padding:5px 14px 5px 6px;font-weight:700;color:#ffe2a8}
.tbl i{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--gold);color:#1a110b;font-style:normal;font-size:14px}
.bubbles{position:absolute;inset:0;pointer-events:none}
.bubbles span{position:absolute;bottom:-12px;width:8px;height:8px;border-radius:50%;border:1.5px solid rgba(255,243,214,.35);animation:rise 7s linear infinite}
@keyframes rise{to{transform:translateY(-190px) translateX(10px);opacity:0}}

/* cocktail hour banner */
.hh{margin:14px 16px 0}
.hh button{position:relative;overflow:hidden;display:block;width:100%;max-width:640px;margin:0 auto;text-align:left;border-radius:16px;padding:14px 16px;color:#1a0d10;
  background:linear-gradient(110deg,#ff5d73,#ffb23f,#f1b94a,#ff5d73);background-size:300% 100%;animation:hhflow 5s ease infinite;box-shadow:0 8px 26px rgba(255,93,115,.28)}
@keyframes hhflow{50%{background-position:100% 0}}
.hh b{display:block;font-family:var(--serif);font-size:24px;line-height:1.1}
.hh small{display:block;font-weight:700;font-size:15px;margin-top:3px;opacity:.85}
.hh .spark{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:34px;animation:wob 1.6s ease-in-out infinite}
@keyframes wob{50%{transform:translateY(-50%) rotate(14deg) scale(1.12)}}

/* category nav */
nav.cats{position:sticky;top:0;z-index:5;background:rgba(23,15,11,.92);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
nav.cats::-webkit-scrollbar{display:none}
nav.cats .wrap{display:flex;gap:6px;padding:10px 16px;width:max-content;min-width:100%}
nav.cats button{white-space:nowrap;padding:8px 14px;border-radius:999px;background:var(--panel2);color:var(--muted);font-weight:700;border:1px solid transparent}
nav.cats button[aria-current="true"]{background:var(--acc);color:#1a110b}

/* sections & items */
main{padding:0 16px}
section.cat{padding-top:22px;scroll-margin-top:60px}
section.cat h2{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:25px;margin:4px 0 12px;color:var(--acc)}
section.cat h2 i{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;font-style:normal;font-size:22px;background:color-mix(in srgb,var(--acc) 18%,transparent);border:1px solid color-mix(in srgb,var(--acc) 45%,transparent)}
.it{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px 12px 18px;margin-bottom:10px;overflow:hidden}
.it::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--acc);opacity:.85}
.it.has{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),0 6px 20px color-mix(in srgb,var(--acc) 22%,transparent)}
.it .nm{font-weight:700;font-size:18px;line-height:1.2}
.vr{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-top:10px}
.vr+.vr{padding-top:10px;border-top:1px dashed var(--line)}
.vp{flex:1 1 90px;min-width:0;line-height:1.25;overflow-wrap:anywhere}
.vp b{display:block;font-weight:500}
.vp span{color:var(--acc);font-weight:700}
.stp{display:flex;align-items:center;gap:2px;flex:none;margin-left:auto}
.stp button{width:42px;height:42px;border-radius:12px;background:var(--panel2);font-size:22px;line-height:1}
.stp .add{background:var(--acc);color:#1a110b;font-weight:700}
.stp button:disabled{opacity:.3;cursor:default}
.stp .cn{min-width:28px;text-align:center;font-weight:700}
.stp .cn.z{color:var(--muted);font-weight:400}
.pop{animation:pop .35s ease}
@keyframes pop{40%{transform:scale(1.45)}}

/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 35%)}
.bar button{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:640px;margin:0 auto;border-radius:16px;padding:16px 18px;font-weight:700;font-size:18px;color:#1a110b;
  background:linear-gradient(90deg,#f1b94a,#ffb23f);box-shadow:0 8px 26px rgba(241,185,74,.35)}
.bar button.bump{animation:bump .4s ease}
@keyframes bump{40%{transform:translateY(-5px) scale(1.03)}}

/* sheet */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(8,4,2,.65);display:flex;align-items:flex-end;justify-content:center}
.sheet .in{background:var(--bg2);border-top:4px solid var(--gold);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 16px calc(16px + env(safe-area-inset-bottom,0px));animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h3{font-family:var(--serif);font-size:27px;margin:0 0 4px;color:var(--gold)}
.sheet .sub{color:var(--muted);margin:0 0 12px}
.ln{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.ln .t{flex:1 1 120px;min-width:0;line-height:1.25}
.ln .t span{color:var(--muted);font-size:14px}
.ln .p{font-weight:700;min-width:64px;text-align:right}
.ln .stp{margin-left:0}
.tot{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0}
.tot b{font-family:var(--serif);font-size:32px;color:var(--gold)}
.btn{display:block;width:100%;padding:15px;border-radius:14px;background:var(--panel2);font-weight:700;font-size:17px;margin-top:8px}
.btn.primary{background:linear-gradient(90deg,#f1b94a,#ffb23f);color:#1a110b}
.btn:disabled{opacity:.5}
.err{color:var(--danger);margin:8px 0 0}
.center{text-align:center;padding:60px 24px;color:var(--muted)}
.center h2{font-family:var(--serif);color:var(--ink);font-size:28px;margin:0 0 8px}
.ok{font-size:56px;line-height:1;margin-bottom:8px}

.hr{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.loyb{font-size:13px;font-weight:700;color:#ffe2a8;background:rgba(241,185,74,.14);border:1px solid rgba(241,185,74,.45);border-radius:999px;padding:5px 10px;white-space:nowrap}
.it.out{opacity:.5}
.sold{font-style:normal;font-size:12px;font-weight:700;color:#1a110b;background:var(--danger);border-radius:6px;padding:2px 6px;margin-left:4px;vertical-align:2px}
.evs{display:grid;gap:10px}
.ev{display:flex;gap:12px;align-items:flex-start;background:linear-gradient(120deg,rgba(176,124,255,.18),rgba(255,93,115,.12));border:1px solid rgba(176,124,255,.45);border-radius:16px;padding:14px}
.ev .ee{font-size:30px;line-height:1}
.ev b{display:block;font-size:19px;font-family:var(--serif)}
.ev .ew{display:inline-block;margin-top:4px;font-weight:700;color:#d9c2ff;font-size:15px}
.ev p{margin:6px 0 0;color:var(--muted);line-height:1.35}
.ft{display:grid;gap:10px;padding:30px 0 10px}
.fl{display:block;text-align:center;padding:14px;border-radius:14px;font-weight:700;text-decoration:none;color:var(--ink);background:var(--panel);border:1px solid var(--line)}
.fl.g{border-color:rgba(255,209,102,.5)}
.fl.i{background:linear-gradient(90deg,rgba(255,93,115,.18),rgba(176,124,255,.18));border-color:rgba(255,93,115,.45)}
.fl.l{width:100%;border-color:rgba(241,185,74,.5)}
.nl{display:grid;gap:6px;color:var(--muted);font-size:14px;margin-top:6px}
.tx{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%;min-width:0}
textarea.tx{resize:vertical}
a.btn{text-align:center;text-decoration:none;color:var(--ink)}
.btn.rv{border:1px solid rgba(255,209,102,.5)}
.btn.ig{background:linear-gradient(90deg,rgba(255,93,115,.22),rgba(176,124,255,.22))}
.card{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center}
.dots{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:300px;margin:0 auto 10px}
.dot{aspect-ratio:1;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font-size:20px}
.dot.on{border:2px solid var(--gold);background:rgba(241,185,74,.15)}
.fr{color:var(--gold)}
#sug{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;justify-content:center}
#sug[hidden]{display:none}
.sg{display:flex;align-items:center;gap:10px;width:100%;max-width:616px;background:var(--bg2);border:1px solid var(--acc);border-radius:16px;padding:10px 10px 10px 12px;box-shadow:0 10px 30px rgba(0,0,0,.45);animation:up .3s ease}
.sg .se{font-size:26px}
.sg .st{flex:1;min-width:0;line-height:1.2}
.sg .st small{display:block;color:var(--acc);font-weight:700;font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.sg .st b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sg .st span{color:var(--muted);font-size:14px}
.sg .sa{background:var(--acc);color:#1a110b;font-weight:700;border-radius:10px;padding:10px 12px;white-space:nowrap}
.sg .sx{width:34px;height:34px;border-radius:10px;background:var(--panel2);color:var(--muted)}
[hidden]{display:none!important}
/* welcome splash */
#splash{position:fixed;inset:0;z-index:50;display:grid;place-items:center;text-align:center;padding:24px;
  background:radial-gradient(circle at 50% 40%,#3a1e22,#170f0b 70%);transition:opacity .5s ease,visibility .5s}
#splash.out{opacity:0;visibility:hidden}
#splash svg{width:120px;height:150px;overflow:visible}
#splash .liq{transform-origin:50% 100%;animation:fill 1.4s .2s ease-out both}
@keyframes fill{from{transform:scaleY(0)}}
#splash .bb{animation:bub 1.6s ease-in infinite;opacity:0}
@keyframes bub{0%{opacity:0;transform:translateY(0)}20%{opacity:1}100%{opacity:0;transform:translateY(-46px)}}
#splash .ol{animation:drop .6s 1.2s cubic-bezier(.3,1.6,.5,1) both}
@keyframes drop{from{transform:translateY(-60px);opacity:0}}
#splash .w{margin-top:18px;font-family:var(--serif);font-size:30px;color:#fff3d6;animation:fadeup .7s .5s ease both}
#splash .w small{display:block;font-family:var(--sans);letter-spacing:.45em;font-size:12px;color:var(--gold);margin-bottom:6px}
#splash .g{margin-top:10px;font-size:18px;color:var(--muted);animation:fadeup .7s .9s ease both}
#splash .g b{color:var(--gold)}
#splash .tap{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:0;right:0;font-size:13px;color:var(--muted);opacity:.7}
@keyframes fadeup{from{opacity:0;transform:translateY(14px)}}

/* fireworks overlay */
#fw{position:fixed;inset:0;z-index:40;pointer-events:none}
#fw.dim{animation:dim var(--ms,3.8s) ease both}
@keyframes dim{0%{background:rgba(10,5,3,0)}10%,75%{background:rgba(10,5,3,.72)}100%{background:rgba(10,5,3,0)}}
#hhpop{position:fixed;inset:0;z-index:41;display:grid;place-items:center;pointer-events:none;text-align:center;padding:24px}
#hhpop div{font-family:var(--serif);font-weight:700;color:#fff;text-shadow:0 0 22px rgba(255,93,115,.9),0 0 4px rgba(0,0,0,.6);animation:zoom 3.2s cubic-bezier(.2,1.4,.4,1) both}
#hhpop b{display:block;font-size:56px;line-height:1;background:linear-gradient(90deg,#ffd166,#ff5d73,#b07cff);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 0 14px rgba(255,93,115,.7))}
#hhpop span{display:block;font-size:26px;margin-top:6px}
@keyframes zoom{0%{transform:scale(.2);opacity:0}15%{transform:scale(1);opacity:1}80%{opacity:1}100%{opacity:0;transform:scale(1.08)}}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

</div></header>
<div id="hh"></div>
<nav class="cats" id="cats" hidden><div class="wrap" id="catbtns"></div></nav>
<main id="main"><div class="center" id="loading">…</div></main>
<div class="bar" id="bar" hidden><button data-act="cart" id="barbtn"></button></div>
<div id="sheet"></div>
<div id="sug" hidden></div>
<canvas id="fw" hidden></canvas><div id="hhpop" hidden></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getFirestore,doc,getDoc,collection,addDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const app=initializeApp({
  apiKey:"AIzaSyDGyXU05B0kApVv4mH9UEElnRFQCbBMxvc",
  authDomain:"snuggest-order.firebaseapp.com",
  projectId:"snuggest-order",
  storageBucket:"snuggest-order.firebasestorage.app",
  messagingSenderId:"95742498164",
  appId:"1:95742498164:web:ccf507421e8f3b2927c821"
});
const fs=getFirestore(app);
window.FBC={
  getConfig:async()=>{const s=await getDoc(doc(fs,'bar/config'));return s.exists()?s.data():null},
  sendOrder:o=>addDoc(collection(fs,'orders'),{...o,status:'new',t:serverTimestamp()}),
  getLoyalty:async id=>{const s=await getDoc(doc(fs,'loyalty/'+id));return s.exists()?s.data():null}
};
window.dispatchEvent(new Event('fbcready'));
</script>

    if(id!==fwRun)return;const dt=Math.min(40,now-last)/16.7;last=now;const el=now-t0;
    ctx.globalCompositeOperation='destination-out';ctx.fillStyle='rgba(0,0,0,.22)';ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='lighter';
    if(!confetti&&el<ms-900&&now>nextRocket){R.push({x:W*(.15+.7*Math.random()),y:H,vy:-(9+Math.random()*4)*dpr,ty:H*(.15+.35*Math.random()),c:cols[(Math.random()*cols.length)|0]});nextRocket=now+260+Math.random()*320}
    for(let i=R.length-1;i>=0;i--){const r=R[i];r.y+=r.vy*dt;ctx.fillStyle=r.c;ctx.beginPath();ctx.arc(r.x,r.y,2.4*dpr,0,7);ctx.fill();if(r.y<=r.ty){burst(r.x,r.y,r.c);R.splice(i,1)}}
    for(let i=P.length-1;i>=0;i--){const p=P[i];p.vx*=.985;p.vy=p.vy*.985+(confetti?.12:.06)*dpr*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=(confetti?.008:.014)*dt;
      if(p.life<=0){P.splice(i,1);continue}ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;
      if(confetti){p.rot+=.15*dt;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillRect(-p.sz,-p.sz/2,p.sz*2,p.sz);ctx.restore()}
      else{ctx.beginPath();ctx.arc(p.x,p.y,p.sz,0,7);ctx.fill()}}
    ctx.globalAlpha=1;
    if(el<ms||P.length||R.length)requestAnimationFrame(step);else{ctx.clearRect(0,0,W,H);cv.hidden=true}
  };
  requestAnimationFrame(step);
}
function celebrate(){
  const hh=menu&&visibleCats().find(c=>c.hh);if(!hh)return;
  fireworks(3800);
  if(RM)return;
  const pop=$('#hhpop');pop.hidden=false;pop.innerHTML=`<div><b>${esc(tx('hhTitle'))}</b><span>${esc(tx('hhSub'))}</span></div>`;
  clearTimeout(celebrate.t);celebrate.t=setTimeout(()=>{pop.hidden=true;pop.innerHTML=''},3300);
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,k=b.dataset.k;
  if(a==='shut'){if(e.target===b)closeSheet();return}
  if(a==='add')bump(k,1);
  else if(a==='sub')bump(k,-1);
  else if(a==='cadd'||a==='csub'){const ne=$('#note');if(ne)note=ne.value;bump(k,a==='cadd'?1:-1);if(cartLines().length)openCart();else closeSheet()}
  else if(a==='cart')openCart();
  else if(a==='close')closeSheet();
  else if(a==='send')send();
  else if(a==='retry')load();
  else if(a==='boom')celebrate();
  else if(a==='loy')loySheet(null);
  else if(a==='loygo')loyGo();
  else if(a==='sugadd'){$('#sug').hidden=true;bump(k,1)}
  else if(a==='sugx')$('#sug').hidden=true;
  else if(a==='jump'){const s=document.getElementById('cat-'+b.dataset.c);if(s)s.scrollIntoView({behavior:'smooth'})}
});
$('#langs').addEventListener('click',e=>{const b=e.target.closest('[data-lang]');if(!b)return;lang=b.dataset.lang;try{localStorage.setItem('snug.lang',lang)}catch(x){}const ne=$('#note');if(ne)note=ne.value;const y=scrollY;render();scrollTo(0,y);if($('#sheet .ln'))openCart()});
let spyT=0;
function spy(){
  const secs=[...document.querySelectorAll('section.cat')];if(!secs.length)return;
  let cur=secs[0].id;for(const s of secs)if(s.getBoundingClientRect().top<90)cur=s.id;
  document.querySelectorAll('#catbtns button').forEach(b=>{const on='cat-'+b.dataset.c===cur;if(b.getAttribute('aria-current')!==String(on)){b.setAttribute('aria-current',String(on));if(on)b.scrollIntoView({block:'nearest',inline:'center'})}});
}
addEventListener('scroll',()=>{if(spyT)return;spyT=requestAnimationFrame(()=>{spyT=0;spy()})},{passive:true});

/* ---------- load ---------- */
let firstLoad=true;
async function load(){
  $('#main').innerHTML='<div class="center">…</div>';
  try{
    const cfgP=window.FBC.getConfig();
    if(firstLoad){const n=parseInt(rawT,10);table=/^\d{1,3}$/.test(rawT)&&n>=1?String(n):null;await splash()}
    const cfg=await cfgP;
    if(!cfg||!cfg.menu||!cfg.menu.cats)throw new Error('no menu');
    menu=cfg.menu;
    const n=parseInt(rawT,10);
    table=/^\d{1,3}$/.test(rawT)&&n>=1&&n<=(menu.tableCount||200)?String(n):null;
    for(const k of Object.keys(cart))if(!findLine(k))delete cart[k];
    render();
    if(firstLoad){firstLoad=false;let b=false;try{b=sessionStorage.getItem('snug.hhboom')==='1';sessionStorage.setItem('snug.hhboom','1')}catch(e){}if(!b&&visibleCats().some(c=>c.hh))setTimeout(celebrate,250)}
  }catch(e){
    firstLoad=false;
    $('#main').innerHTML=`<div class="center"><h2>:(</h2><p>${esc(tx('loadErr'))}</p><button class="btn primary" data-act="retry" style="max-width:260px;margin:16px auto 0">${esc(tx('retry'))}</button></div>`;
  }
}
renderLangs();
if(window.FBC)load();else addEventListener('fbcready',load,{once:true});
setInterval(()=>{if(menu&&!$('#sheet').innerHTML){const y=scrollY;render();scrollTo(0,y)}},60000);
</script>
